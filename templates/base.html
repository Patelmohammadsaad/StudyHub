<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padhoyaha</title>
<style>
:root {
  --charcoal: #17191C;
  --grey: #929DA7;
  --violet: #7C3AED;
  --bg: #F8F9FA;
  --page-bg: #EFF4FF;
  --grad2: linear-gradient(135deg, #DBEAFE, #CFFAFE);
  --blue-grad: linear-gradient(135deg, #2563EB, #1E40AF);
}
html, body {
  height: 100%;
  margin: 0;
}
body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #334155;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
  flex: 1;
  width: 100%;
  box-sizing: border-box;
}
footer {
  margin-top: auto;
}
h1, h2 { color: var(--charcoal); }
a { color: var(--violet); }
@media (max-width: 600px) {
  main { padding: 12px; }
}
</style>
</head>
<body>
{% include 'partials/navbar.html' %}

<main>
{% block content %}
{% endblock %}
</main>

{% include 'partials/footer.html' %}
</body>
</html>
