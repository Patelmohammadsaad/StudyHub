{% extends 'base.html' %}

{% block content %}
<style>
body {
  background: var(--page-bg) !important;
}
</style>

<h1>{{ subject.name }} - Chapters</h1>

<div style="display: grid; gap: 12px;">
{% for c in chapters %}
  <div style="padding: 16px; background: var(--grad2); border: 1px solid #C4B5FD; border-radius: 12px;">
    <strong>Chapter {{ c.number }} - {{ c.name }}</strong><br><br>
    <a href="{% url 'chapter_detail' c.pk %}" style="background: var(--blue-grad); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none;">View</a>
  </div>
{% empty %}
  <p>No chapters yet.</p>
{% endfor %}
</div>

<a href="{% url 'class_detail' subject.school_class.pk %}">Back to {{ subject.school_class.name }}</a>

{% endblock %}
