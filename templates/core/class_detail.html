{% extends 'base.html' %}

{% block content %}
<style>
body {
  background: var(--page-bg) !important;
}
</style>

<h1>{{ school_class.name }}</h1>
<p>Subjects:</p>

<div style="display: grid; gap: 12px;">
{% for s in subjects %}
  <div style="padding: 16px; background: var(--grad2); border: 1px solid #C4B5FD; border-radius: 12px;">
    <strong>{{ s.name }}</strong><br><br>
    <a href="{% url 'subject_books' s.pk %}" style="background: var(--blue-grad); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none;">Book</a>
    <a href="{% url 'subject_notes' s.pk %}" style="background: var(--blue-grad); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; margin-left: 8px;">Note</a>
    <a href="{% url 'subject_papers' s.pk %}" style="background: var(--blue-grad); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; margin-left: 8px;">Paper</a>
  </div>
{% empty %}
  <p>No subjects yet.</p>
{% endfor %}
</div>

<p style="margin-top: 20px;"><a href="/school/">Back to Classes</a></p>
{% endblock %}
