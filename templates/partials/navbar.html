{% load static %}
<style>
  .navbar { background: #17191C; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; box-sizing: border-box; width: 100%; font-family: Arial, sans-serif; }
  .navbar .logo { display: flex; align-items: center; justify-self: start; }
  .navbar .logo img { height: 32px; width: 32px; border-radius: 6px; }
  .navbar .title { color: white; font-size: 18px; font-weight: bold; text-decoration: none; text-align: center; }
  .navbar .icons { display: flex; align-items: center; justify-self: end; }
  .navbar .icons a { color: white; text-decoration: none; font-size: 18px; }
  @media (max-width: 768px) {
    .navbar { padding: 10px 12px; }
    .navbar .logo img { height: 28px; width: 28px; }
    .navbar .title { font-size: 16px; }
    .navbar .icons a { font-size: 16px; }
  }
  @media (max-width: 480px) {
    .navbar { padding: 8px 8px; }
    .navbar .logo img { height: 26px; width: 26px; }
    .navbar .title { font-size: 15px; }
    .navbar .icons a { font-size: 15px; }
  }
</style>

<header class="navbar">
  <a href="/" class="logo">
    <img src="{% static 'logo.png' %}" alt="PadhoYaha">
  </a>
  <a href="/" class="title">PadhoYaha</a>

  <!-- <a href="/">Home</a>
  <a href="/school/">School</a>
  <a href="/college/">College</a> -->
  <span class="icons">
    <a href="#">🔔</a>
    <!-- <a href="/profile/">👤</a> -->
  </span>
</header>
