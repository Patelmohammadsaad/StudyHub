{% load static %}
<style>
  .navbar { background: #17191C; padding: 12px 16px; display: flex; align-items: center; gap: 16px; box-sizing: border-box; width: 100%; white-space: nowrap; }
  .navbar .logo { color: white; font-size: 22px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .navbar .logo img { height: 32px; width: 32px; border-radius: 6px; }
  .navbar a { color: white; text-decoration: none; font-size: 16px; }
  .navbar .icons { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .navbar .icons a { font-size: 20px; }
  @media (max-width: 768px) {
    .navbar { padding: 10px 12px; gap: 10px; }
    .navbar .logo { font-size: 19px; }
    .navbar .logo img { height: 28px; width: 28px; }
    .navbar a { font-size: 14px; }
    .navbar .icons a { font-size: 18px; }
  }
  @media (max-width: 480px) {
    .navbar { padding: 8px 8px; gap: 7px; }
    .navbar .logo { font-size: 16px; }
    .navbar .logo img { height: 26px; width: 26px; }
    .navbar a { font-size: 13px; }
    .navbar .icons { gap: 8px; }
    .navbar .icons a { font-size: 16px; }
  }
</style>

<header class="navbar">
  <a href="/" class="logo">
    <img src="{% static 'logo.png' %}" alt="PadhoYaha"> Padhoyaha
  </a>
  <a href="/">Home</a>
  <a href="/school/">School</a>
  <a href="/college/">College</a>
  <span class="icons">
    <a href="#">🔔</a>
    <!-- <a href="/profile/">👤</a> -->
  </span>
</header>
