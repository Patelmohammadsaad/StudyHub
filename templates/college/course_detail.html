{% extends 'base.html' %}

{% block content %}
<h1>{{ course.name }}</h1>
<p>Semesters:</p>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;">
{% for s in semesters %}
  <a href="{% url 'semester_detail' s.pk %}" style="display: block; padding: 16px; background: #EDE9FE; border: 1px solid #C4B5FD; border-radius: 12px; text-align: center; font-weight: bold; color: #17191C; text-decoration: none;">
  Sem {{ s.number }}
  </a>

{% empty %}
  <p>No semesters yet.</p>
{% endfor %}
</div>

<p style="margin-top: 20px;"><a href="/college/">Back to Universities</a></p>
{% endblock %}
