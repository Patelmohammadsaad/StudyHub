{% extends 'base.html' %}

{% block content %}
<style>
body {
  background: var(--page-bg) !important;
}
</style>

<h1>Sem {{ semester.number }} — {{ semester.course.name }}</h1>
<p>Subjects:</p>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;">
{% for s in subjects %}
  <a href="{% url 'college_subject_detail' s.pk %}" style="display: block; padding: 20px 16px; background: var(--grad2); border: 1px solid #C4B5FD; border-radius: 12px; text-align: center; font-weight: bold; color: #17191C; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
  {{ s.name }}
  </a>

{% empty %}
  <p>No subjects yet.</p>
{% endfor %}
</div>

<p style="margin-top: 20px;"><a href="/college/">Back to Universities</a></p>
{% endblock %}
