{% extends 'base.html' %}

{% block content %}
<h1>{{ university.name }}</h1>
<p>Courses:</p>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;">
{% for c in courses %}
  <a href="{% url 'course_detail' c.pk %}" style="display: block; padding: 16px; background: #EDE9FE; border: 1px solid #C4B5FD; border-radius: 12px; text-align: center; font-weight: bold; color: #17191C; text-decoration: none;">
  {{ c.name }}
  </a>

{% empty %}
  <p>No courses yet.</p>
{% endfor %}
</div>

<p style="margin-top: 20px;"><a href="/college/">Back to Universities</a></p>
{% endblock %}
