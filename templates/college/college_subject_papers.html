{% extends 'base.html' %}

{% block content %}
<style>
body {
  background: var(--page-bg) !important;
}
</style>

<h1>{{ subject.name }} - Papers</h1>

<div style="display: grid; gap: 12px;">
{% for p in papers %}
  <div style="padding: 16px; background: var(--grad2); border: 1px solid #C4B5FD; border-radius: 12px;">
    <strong>{{ p.title }}</strong> — {{ p.year }}<br><br>
    <a href="{{ p.pdf.url }}" target="_blank" style="background: var(--blue-grad); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none;">View Paper</a>
    {% if p.solution_pdf %}
    <a href="{{ p.solution_pdf.url }}" target="_blank" style="background: white; color: #17191C; padding: 8px 16px; border: 1px solid #17191C; border-radius: 8px; text-decoration: none; margin-left: 8px;">View Solution</a>
    {% endif %}
  </div>
{% empty %}
  <p>No papers yet.</p>
{% endfor %}
</div>

<a href="{% url 'semester_detail' subject.semester.pk %}">Back to Subjects</a>
{% endblock %}
