{% extends 'base.html' %}

{% block content %}
<h1>College</h1>
<p>Select a University to view Courses</p>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;">
{% for u in universities %}
  <a href="{% url 'university_detail' u.pk %}" style="display: block; padding: 16px; background: #EDE9FE; border: 1px solid #C4B5FD; border-radius: 12px; text-align: center; text-decoration: none; color: #17191C; font-weight: bold;">
    {{ u.name }}
  </a>
{% endfor %}
</div>
{% endblock %}
